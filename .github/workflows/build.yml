name: Build Flutter APK

# Runs only when you push a version tag (e.g. v1.0.15) or press "Run workflow" by hand.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Create Android project
      run: flutter create --org com.zeroex --project-name annua --platforms=android .

    - name: Add native sound helper
      run: |
        f=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
        cp android_native/MainActivity.kt "$f"

    - name: Add notification icon resources
      run: cp -r android_res/. android/app/src/main/res/

    - name: Patch Android config
      run: |
        python3 - <<'EOF'
        import re, glob
        m = 'android/app/src/main/AndroidManifest.xml'
        s = open(m).read()
        perms = ''.join(f'<uses-permission android:name="android.permission.{p}"/>' for p in
          ['POST_NOTIFICATIONS','RECEIVE_BOOT_COMPLETED','VIBRATE','WAKE_LOCK','USE_EXACT_ALARM','USE_FULL_SCREEN_INTENT','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS','INTERNET'])
        perms += '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>'
        perms += '<queries>' + ''.join(f'<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="{x}"/></intent>' for x in ['https','tel','sms']) + '</queries>'
        recv = '''<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter>
        <action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
        <action android:name="android.intent.action.QUICKBOOT_POWERON"/></intent-filter></receiver>'''
        s = s.replace('android:label="annua"', 'android:label="Annua"')
        s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:showWhenLocked="true" android:turnScreenOn="true"', 1)
        s = s.replace('<application', perms + '<application', 1).replace('</application>', recv + '</application>', 1)
        open(m, 'w').write(s)

        g = glob.glob('android/app/build.gradle*')[0]
        t = open(g).read()

        t = re.sub(r'compileSdk\w*\s*=?\s*\d+', 'compileSdkVersion 36', t)
        if 'compileSdkVersion' not in t and 'compileSdk' not in t:
            t = re.sub(r'android\s*\{', 'android {\n    compileSdkVersion 36', t, 1)

        if g.endswith('.kts'):
            t = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', t, 1)
            t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
        else:
            t = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', t, 1)
            t += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
        open(g, 'w').write(t)
        EOF

    - name: Set up release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "No keystore secret found - building with the temporary debug key (updates will not install over other builds)"
          exit 0
        fi
        KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/annua.jks
        printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=annua.jks\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
        python3 - <<'PY'
        import glob
        g = glob.glob('android/app/build.gradle*')[0]
        t = open(g).read()
        if g.endswith('.kts'):
            block = '''    signingConfigs {
            create("release") {
                val props = Properties()
                props.load(FileInputStream(rootProject.file("key.properties")))
                keyAlias = props["keyAlias"] as String
                keyPassword = props["keyPassword"] as String
                storeFile = file(props["storeFile"] as String)
                storePassword = props["storePassword"] as String
            }
        }

        '''
            t = t.replace('buildTypes {', block + 'buildTypes {', 1)
            # inside android { } the name "java" means the Java extension, so import the classes at the top
            t = 'import java.io.FileInputStream\nimport java.util.Properties\n\n' + t
            t = t.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
            ok = 'signingConfigs.getByName("release")' in t
        else:
            block = '''    signingConfigs {
            release {
                def props = new Properties()
                props.load(new FileInputStream(rootProject.file("key.properties")))
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
            }
        }

        '''
            t = t.replace('buildTypes {', block + 'buildTypes {', 1)
            t = t.replace('signingConfigs.debug', 'signingConfigs.release')
            ok = 'signingConfigs.release' in t
        if not ok:
            raise SystemExit('Could not switch the release build to the real signing key')
        open(g, 'w').write(t)
        print('Release signing enabled')
        PY

    - name: Relax Kotlin JVM target check
      run: echo "kotlin.jvm.target.validation.mode=IGNORE" >> android/gradle.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Generate app icons
      run: dart run flutter_launcher_icons

    - name: Raise plugin compileSdk to 36
      run: |
        find $HOME/.pub-cache/hosted -path '*/android/build.gradle*' -exec sed -i -E 's/(compileSdk(Version)?[[:space:]=]+)[0-9]+/\136/' {} +

    - name: Build APK
      run: flutter build apk --release

    - name: Name the APK
      run: cp build/app/outputs/flutter-apk/app-release.apk Annua.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: Annua.apk

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Annua.apk
        name: Annua ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
