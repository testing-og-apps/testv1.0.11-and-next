name: annua
description: Never miss a birthday or anniversary again.
publish_to: 'none'
version: 1.0.15+16

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  url_launcher: ^6.3.1
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  dynamic_color: ^1.7.0
  flutter_svg: ^2.0.10+1
  android_intent_plus: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FAF4E6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/brands/
